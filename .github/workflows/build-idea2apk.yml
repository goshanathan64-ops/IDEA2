name: Build IDEA2APK Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "project_schema.py"
      - "template_catalog.py"
      - "generator_engine.py"
      - "expense_tracker_generator.py"
      - "github_builder.py"
      - "auto_fixer.py"
      - "buildozer.spec"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: idea2apk-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Keep the debug signing key stable between CI builds so future APKs
      # can update the same installed package without a signing mismatch.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: idea2apk-debug-signing-key-v1

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev libltdl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33 virtualenv

      - name: Validate Python source and run tests
        run: |
          python -m compileall -q main.py project_schema.py template_catalog.py feature_engine.py generator_engine.py expense_tracker_generator.py school_records_generator.py booking_appointments_generator.py github_builder.py auto_fixer.py
          python -m unittest discover -s tests -v

      - name: Build APK with automatic repair
        run: python auto_fixer.py --build --max-attempts 3

      - name: Upload IDEA2APK APK
        uses: actions/upload-artifact@v4
        with:
          name: IDEA2APK-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="idea2apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" bin/*.apk \
            --title "IDEA2APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated IDEA2APK Android APK build. Download the APK asset directly from this release."
