name: Build NexGen Shop Manager Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexgen-shop-manager-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev libltdl-dev cmake
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33 virtualenv
      - name: Check Python syntax
        working-directory: apps/nexgen_shop_manager
        run: python -m py_compile main.py
      - name: Build debug APK
        working-directory: apps/nexgen_shop_manager
        run: buildozer -v android debug
      - name: Upload NexGen Shop Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: NexGen-Shop-Manager-Android-APK
          path: apps/nexgen_shop_manager/bin/*.apk
          if-no-files-found: error
          retention-days: 7
